<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · BAUGMENT — Content &amp; Analytics Desk</title>
<meta name="description" content="BAUGMENT — the social media content and analytics desk for PT Baugment Teknologi Edukasi, Jakarta.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/baugment.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
</head>
<body>

<main class="gate">

  <!-- The grid: eight modules, each one a number the desk tracks.
       They assemble on load, then the values count up. -->
  <section class="gate__stage" aria-hidden="true">
    <div class="gate__stageInner">
      <p class="gate__kicker">Baugment · Digital Learning for Corporate</p>
      <h1 class="gate__headline">Everything we published, and what it did.</h1>
      <p class="gate__note">Graha Mampang Lt.3, Jakarta Selatan. One desk for planning, measuring and reporting.</p>
    </div>

    <div class="modules" id="modules"></div>

    <div class="gate__stageInner">
      <p class="gate__kicker" style="opacity:.7;color:rgba(248,250,252,.5)">Content &amp; Analytics Desk</p>
    </div>
  </section>

  <section class="gate__form">
    <div class="gate__formInner">
      <div class="gate__logo">
        <div class="brandchip">
          <span class="brandmark brandmark--lg" aria-hidden="true">B</span>
          <span>
            <span class="wordmark">Baug<b>ment</b></span>
            <span class="gate__logotag" style="display:block">Be and Augment</span>
          </span>
        </div>
      </div>

      <h2 class="gate__title">Sign in to BAUGMENT</h2>
      <p class="dim tiny" style="margin:8px 0 26px">The social media desk. One account for now.</p>

      <form id="loginForm" novalidate>
        <label class="field">
          <span class="field__label" id="idLabel">Username</span>
          <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <span style="position:relative;display:block">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required style="padding-right:42px">
            <button type="button" class="btn btn--ghost btn--icon btn--sm" id="peek"
                    style="position:absolute;right:4px;top:50%;transform:translateY(-50%)" aria-label="Show password"></button>
          </span>
        </label>

        <label class="check" style="margin-bottom:18px">
          <input type="checkbox" id="remember"> Keep me signed in on this device
        </label>

        <div class="field__error" id="loginError" role="alert" style="margin-bottom:12px;min-height:18px"></div>

        <button class="btn btn--primary" type="submit" id="submitBtn" style="width:100%;height:42px">Sign in</button>
      </form>

    </div>
  </section>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/remote.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  var icon = BAUGMENT.icon.render;

  var remote = BAUGMENT.config.isConfigured();

  /* Already signed in? Don't make them do it twice. In shared mode the answer
     lives in Supabase, so it has to be asked asynchronously. */
  if (!remote && BAUGMENT.auth.session()) { window.location.replace('app.html#/dashboard'); return; }
  if (remote) {
    BAUGMENT.auth.init().then(function (s) {
      if (s) window.location.replace('app.html#/dashboard');
    }).catch(function () { /* stay on the form */ });
  }

  /* --- The module grid -------------------------------------------------- */
  var SEGMENTS = [
    { k: 'Posts',      v: 500,     fmt: 'int' },
    { k: 'Reach',      v: 4400000, fmt: 'compact', lit: true },
    { k: 'Eng. rate',  v: 4.4,     fmt: 'pct' },
    { k: 'Followers',  v: 43800,   fmt: 'compact' },
    { k: 'Platforms',  v: 4,       fmt: 'int', lit: true },
    { k: 'Campaigns',  v: 50,      fmt: 'int' },
    { k: 'Pillars',    v: 20,      fmt: 'int' },
    { k: 'Ideas',      v: 44,      fmt: 'int', lit: true }
  ];

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap = document.getElementById('modules');

  function present(s, value) {
    if (s.fmt === 'compact') return BAUGMENT.util.fmt.compact(value);
    if (s.fmt === 'pct') return value.toFixed(1) + '%';
    return BAUGMENT.util.fmt.int(value);
  }

  wrap.innerHTML = SEGMENTS.map(function (s, i) {
    return '<div class="modules__seg' + (s.lit ? ' is-lit' : '') + '" style="animation-delay:' +
      (reduce ? 0 : 120 + i * 70) + 'ms">' +
      '<span class="modules__k">' + s.k + '</span>' +
      '<span class="modules__v" data-seg="' + i + '">' + (reduce ? present(s, s.v) : present(s, 0)) + '</span>' +
      '</div>';
  }).join('');

  if (!reduce) {
    SEGMENTS.forEach(function (s, i) {
      var node = wrap.querySelector('[data-seg="' + i + '"]');
      var start = null, dur = 900, delay = 260 + i * 70;
      setTimeout(function () {
        requestAnimationFrame(function tick(t) {
          if (start === null) start = t;
          var p = Math.min(1, (t - start) / dur);
          var eased = 1 - Math.pow(1 - p, 3);
          node.textContent = present(s, s.v * eased);
          if (p < 1) requestAnimationFrame(tick);
        });
      }, delay);
    });
  }

  /* --- Form ------------------------------------------------------------- */
  var form = document.getElementById('loginForm');
  var user = document.getElementById('username');
  var pass = document.getElementById('password');
  var err = document.getElementById('loginError');
  var btn = document.getElementById('submitBtn');
  var peek = document.getElementById('peek');

  peek.innerHTML = icon('eye', 15);
  peek.addEventListener('click', function () {
    var showing = pass.type === 'text';
    pass.type = showing ? 'password' : 'text';
    peek.innerHTML = icon(showing ? 'eye' : 'eyeOff', 15);
    peek.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    pass.focus();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';

    if (!user.value.trim() || !pass.value) {
      err.textContent = 'Enter both a username and a password.';
      (user.value.trim() ? pass : user).focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Checking…';

    BAUGMENT.auth.login(user.value, pass.value, document.getElementById('remember').checked)
      .then(function (res) {
        if (res.ok) {
          btn.textContent = 'Welcome back';
          window.location.replace('app.html#/dashboard');
          return;
        }
        err.textContent = res.error;
        btn.disabled = false;
        btn.textContent = 'Sign in';
        pass.value = '';
        pass.focus();
      })
      .catch(function () {
        err.textContent = 'Something went wrong signing in. Reload the page and try again.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      });
  });

  /* Shared mode means real accounts in Supabase Auth; local mode keeps the
     single documented credential. The field itself is the only tell — the
     project ref and the fallback password are deliberately not printed here,
     since this page is public. */
  if (remote) {
    document.getElementById('idLabel').textContent = 'Email';
    user.type = 'email';
    user.setAttribute('autocomplete', 'email');
    user.placeholder = 'you@baugment.com';
  }

  user.focus();
})();
</script>
</body>
</html>
